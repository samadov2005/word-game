<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordPlay - English Party Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B9D;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #1A1A2E;
            --light: #F8F9FA;
            --gray: #6C757D;
            --success: #52C493;
            --shadow: rgba(26, 26, 46, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .logo {
            font-family: 'Fredoka', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        .tagline {
            color: var(--gray);
            font-size: 1.1rem;
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 16px;
            animation: fadeIn 0.8s ease-out 0.6s both;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--gray);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .stat-value {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--dark);
        }

        .difficulty-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.5rem;
            color: var(--dark);
            margin-bottom: 20px;
            text-align: center;
        }

        .difficulty-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .difficulty-btn {
            flex: 1;
            min-width: 150px;
            padding: 20px 30px;
            border: 3px solid transparent;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .difficulty-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .difficulty-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .difficulty-btn span {
            position: relative;
            z-index: 1;
        }

        .difficulty-btn.easy {
            background: linear-gradient(135deg, #52C493, #3AA876);
            color: white;
        }

        .difficulty-btn.medium {
            background: linear-gradient(135deg, #FFE66D, #FFC93C);
            color: var(--dark);
        }

        .difficulty-btn.hard {
            background: linear-gradient(135deg, #FF6B9D, #E74C7C);
            color: white;
        }

        .difficulty-btn.active {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .difficulty-btn.easy.active {
            border-color: #52C493;
        }

        .difficulty-btn.medium.active {
            border-color: #FFE66D;
        }

        .difficulty-btn.hard.active {
            border-color: #FF6B9D;
        }

        .game-area {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.6s ease-out;
        }

        .game-area.active {
            display: block;
        }

        .get-word-btn {
            width: 100%;
            padding: 25px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
            position: relative;
            overflow: hidden;
        }

        .get-word-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .get-word-btn:hover::before {
            left: 100%;
        }

        .get-word-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.4);
        }

        .get-word-btn:active {
            transform: translateY(0);
        }

        .get-word-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .word-display {
            margin-top: 30px;
            padding: 40px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 20px;
            text-align: center;
            display: none;
            animation: scaleIn 0.5s ease-out;
            border: 3px solid var(--accent);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .word-display.show {
            display: block;
        }

        .current-word {
            font-family: 'Fredoka', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .word-type {
            font-size: 1rem;
            color: var(--gray);
            font-style: italic;
            margin-bottom: 30px;
        }

        .hints-container {
            margin-top: 30px;
            display: none;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hints-container.show {
            display: block;
        }

        .hints-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.3rem;
            color: var(--dark);
            margin-bottom: 15px;
            text-align: left;
        }

        .hint {
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 4px solid var(--secondary);
            animation: slideRight 0.5s ease-out both;
            box-shadow: 0 2px 10px var(--shadow);
        }

        .hint:nth-child(2) {
            animation-delay: 0.1s;
        }

        .hint:nth-child(3) {
            animation-delay: 0.2s;
        }

        .hint:nth-child(4) {
            animation-delay: 0.3s;
        }

        .hint:nth-child(5) {
            animation-delay: 0.4s;
        }

        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .hint-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: var(--secondary);
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            color: white;
            font-size: 0.8rem;
            font-weight: 700;
            margin-right: 10px;
            vertical-align: middle;
        }

        .hint-text {
            color: var(--dark);
            font-size: 1rem;
            line-height: 1.6;
            display: inline;
        }

        .timer-container {
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .timer-container.show {
            display: block;
            animation: fadeIn 0.6s ease-out;
        }

        .timer {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 12px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .timer-icon {
            font-size: 1.5rem;
        }

        .timer-value {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            min-width: 60px;
        }

        .timer-value.warning {
            color: #ff6b6b;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            display: none;
        }

        .action-buttons.show {
            display: flex;
            animation: fadeIn 0.6s ease-out;
        }

        .next-btn, .stop-timer-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .next-btn {
            background: linear-gradient(135deg, var(--success), #3AA876);
            color: white;
            box-shadow: 0 5px 15px rgba(82, 196, 147, 0.3);
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(82, 196, 147, 0.4);
        }

        .stop-timer-btn {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            color: var(--dark);
            box-shadow: 0 5px 15px var(--shadow);
        }

        .stop-timer-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--shadow);
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
                border-radius: 24px;
            }

            .logo {
                font-size: 2.2rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .stats-bar {
                flex-direction: column;
                gap: 15px;
            }

            .difficulty-buttons {
                flex-direction: column;
            }

            .difficulty-btn {
                min-width: 100%;
            }

            .current-word {
                font-size: 2rem;
            }

            .action-buttons {
                flex-direction: column;
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: var(--primary);
            position: absolute;
            animation: confetti-fall 3s linear;
            z-index: 1000;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .sound-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border: 2px solid var(--secondary);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.3rem;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .sound-toggle:hover {
            transform: scale(1.1);
            background: var(--secondary);
            color: white;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e9ecef;
            color: var(--gray);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sound-toggle" id="soundToggle" title="Toggle Sound">🔊</div>
        
        <div class="header">
            <h1 class="logo">WordPlay</h1>
            <p class="tagline">Learn English Through Fun Word Explanation Game</p>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">Round</div>
                <div class="stat-value" id="roundCount">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="scoreCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="levelDisplay">-</div>
            </div>
        </div>

        <div class="difficulty-section">
            <h2 class="section-title">Choose Your Challenge</h2>
            <div class="difficulty-buttons">
                <button class="difficulty-btn easy" data-level="easy">
                    <span>🟢 Easy</span>
                </button>
                <button class="difficulty-btn medium" data-level="medium">
                    <span>🟡 Medium</span>
                </button>
                <button class="difficulty-btn hard" data-level="hard">
                    <span>🔴 Hard</span>
                </button>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <button class="get-word-btn" id="getWordBtn">
                🎯 Get Random Word
            </button>

            <div class="word-display" id="wordDisplay">
                <div class="current-word" id="currentWord"></div>
                <div class="word-type" id="wordType"></div>
                
                <div class="timer-container" id="timerContainer">
                    <div class="timer">
                        <span class="timer-icon">⏱️</span>
                        <span class="timer-value" id="timerValue">60</span>
                    </div>
                </div>

                <div class="hints-container" id="hintsContainer">
                    <h3 class="hints-title">💡 Hints to Help You Explain:</h3>
                    <div id="hintsList"></div>
                </div>

                <div class="action-buttons" id="actionButtons">
                    <button class="stop-timer-btn" id="stopTimerBtn">⏸️ Stop Timer</button>
                    <button class="next-btn" id="nextBtn">➡️ Next Word</button>
                </div>
            </div>
        </div>

        <div class="footer">
            Built for learning, by Avazbek Samadov
        </div>
    </div>

        // Game state
        let currentLevel = null;
        let currentWord = null;
        let usedWords = [];
        let round = 1;
        let score = 0;
        let timer = null;
        let timeLeft = 60;
        let soundEnabled = true;

        // DOM elements
        const difficultyButtons = document.querySelectorAll('.difficulty-btn');
        const gameArea = document.getElementById('gameArea');
        const getWordBtn = document.getElementById('getWordBtn');
        const wordDisplay = document.getElementById('wordDisplay');
        const currentWordEl = document.getElementById('currentWord');
        const wordTypeEl = document.getElementById('wordType');
        const hintsContainer = document.getElementById('hintsContainer');
        const hintsList = document.getElementById('hintsList');
        const timerContainer = document.getElementById('timerContainer');
        const timerValue = document.getElementById('timerValue');
        const actionButtons = document.getElementById('actionButtons');
        const nextBtn = document.getElementById('nextBtn');
        const stopTimerBtn = document.getElementById('stopTimerBtn');
        const roundCountEl = document.getElementById('roundCount');
        const scoreCountEl = document.getElementById('scoreCount');
        const levelDisplayEl = document.getElementById('levelDisplay');
        const soundToggle = document.getElementById('soundToggle');

        // Select difficulty level
        difficultyButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                difficultyButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLevel = btn.dataset.level;
                usedWords = [];
                
                gameArea.classList.add('active');
                wordDisplay.classList.remove('show');
                hintsContainer.classList.remove('show');
                timerContainer.classList.remove('show');
                actionButtons.classList.remove('show');
                
                levelDisplayEl.textContent = currentLevel.toUpperCase();
                
                playSound('click');
            });
        });

        // Get random word
        getWordBtn.addEventListener('click', () => {
            if (!currentLevel) {
                alert('Please select a difficulty level first!');
                return;
            }

            const levelWords = wordDatabase[currentLevel];
            const availableWords = levelWords.filter(w => !usedWords.includes(w.word));

            if (availableWords.length === 0) {
                usedWords = [];
                alert('You\'ve gone through all words! Starting fresh.');
            }

            const randomWord = availableWords[Math.floor(Math.random() * availableWords.length)];
            currentWord = randomWord;
            usedWords.push(randomWord.word);

            displayWord(randomWord);
            startTimer();
            playSound('reveal');
            createConfetti();
        });

        // Display word and hints
        function displayWord(word) {
            currentWordEl.textContent = word.word;
            wordTypeEl.textContent = `(${word.type})`;
            
            wordDisplay.classList.add('show');
            
            setTimeout(() => {
                hintsList.innerHTML = '';
                word.hints.forEach((hint, index) => {
                    const hintDiv = document.createElement('div');
                    hintDiv.className = 'hint';
                    hintDiv.innerHTML = `
                        <span class="hint-icon">${index + 1}</span>
                        <span class="hint-text">${hint}</span>
                    `;
                    hintsList.appendChild(hintDiv);
                });
                
                hintsContainer.classList.add('show');
                timerContainer.classList.add('show');
                actionButtons.classList.add('show');
            }, 300);
        }

        // Timer functions
        function startTimer() {
            stopTimer();
            timeLeft = 60;
            timerValue.textContent = timeLeft;
            timerValue.classList.remove('warning');
            
            timer = setInterval(() => {
                timeLeft--;
                timerValue.textContent = timeLeft;
                
                if (timeLeft <= 10) {
                    timerValue.classList.add('warning');
                    if (soundEnabled) {
                        playSound('tick');
                    }
                }
                
                if (timeLeft === 0) {
                    stopTimer();
                    playSound('timeup');
                    alert('Time\'s up! Moving to next word.');
                    nextWord();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }

        stopTimerBtn.addEventListener('click', () => {
            stopTimer();
            timerValue.classList.remove('warning');
            playSound('click');
        });

        // Next word
        nextBtn.addEventListener('click', () => {
            stopTimer();
            round++;
            score += 10;
            roundCountEl.textContent = round;
            scoreCountEl.textContent = score;
            
            wordDisplay.classList.remove('show');
            hintsContainer.classList.remove('show');
            timerContainer.classList.remove('show');
            actionButtons.classList.remove('show');
            
            playSound('success');
        });

        // Sound toggle
        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
            playSound('click');
        });

        // Sound effects (using Web Audio API)
        function playSound(type) {
            if (!soundEnabled) return;
            
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            switch(type) {
                case 'click':
                    oscillator.frequency.value = 800;
                    gainNode.gain.value = 0.1;
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.1);
                    break;
                case 'reveal':
                    oscillator.frequency.value = 600;
                    gainNode.gain.value = 0.15;
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.2);
                    break;
                case 'success':
                    oscillator.frequency.value = 800;
                    gainNode.gain.value = 0.2;
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.15);
                    setTimeout(() => {
                        const osc2 = audioContext.createOscillator();
                        const gain2 = audioContext.createGain();
                        osc2.connect(gain2);
                        gain2.connect(audioContext.destination);
                        osc2.frequency.value = 1000;
                        gain2.gain.value = 0.2;
                        osc2.start();
                        osc2.stop(audioContext.currentTime + 0.15);
                    }, 100);
                    break;
                case 'tick':
                    oscillator.frequency.value = 400;
                    gainNode.gain.value = 0.05;
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.05);
                    break;
                case 'timeup':
                    oscillator.frequency.value = 200;
                    gainNode.gain.value = 0.3;
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.5);
                    break;
            }
        }

        // Confetti animation
        function createConfetti() {
            const colors = ['#FF6B9D', '#4ECDC4', '#FFE66D', '#52C493'];
            const confettiCount = 50;
            
            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }

        // Next word helper
        function nextWord() {
            round++;
            roundCountEl.textContent = round;
            
            wordDisplay.classList.remove('show');
            hintsContainer.classList.remove('show');
            timerContainer.classList.remove('show');
            actionButtons.classList.remove('show');
        }
